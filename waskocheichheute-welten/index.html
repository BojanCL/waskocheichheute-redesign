<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Welten-Workshop · Was koche ich heute?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Inter:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { position: relative; overflow: hidden; font: 600 14px/1.3 Inter, system-ui, sans-serif; background: #1a1515; color: #fffaf3; --barh: 0px; --off: 0px; }
  /* Die Leiste scrollt mit der Seite weg: --off ist die gemeldete Scrollhöhe, höchstens so hoch wie die Leiste */
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: #111; transform: translateY(calc(var(--off) * -1)); }
  .bar b { font: 800 16px/1 'Bricolage Grotesque', Inter, sans-serif; margin-right: 6px; }
  .bar b span { color: #f68e10; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #444; border-radius: 10px; overflow: hidden; }
  .seg button { min-height: 38px; padding: 0 14px; border: 0; background: transparent; color: #e5e5e5; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #f68e10; color: #261f1f; }
  .seg button small { opacity: .7; margin-right: 4px; }
  .note { flex: 1 1 260px; color: #a3a3a3; font-weight: 500; }
  a.open { color: #fffaf3; }
  .stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: stretch; padding: 0; transform: translateY(calc(var(--barh) - var(--off))); }
  iframe { width: 100%; height: 100%; border: 0; background: #fdf1e6; }
  body.is-phone .bar { transform: none; }
  body.is-phone .stage { top: var(--barh); transform: none; padding: 20px; align-items: center; }
  body.is-phone iframe { width: 390px; max-width: 100%; height: min(844px, 100%); border: 10px solid #000; border-radius: 36px; }
</style>
</head>
<body>
<div class="bar" role="region" aria-label="Workshop-Steuerung">
  <b>Welten-<span>Workshop</span></b>
  <div class="seg" role="group" aria-label="Richtung">
    <button type="button" data-page="startseite.html" aria-pressed="true"><small>Neu</small>Startseite</button>
    <button type="button" data-page="startseite-v2.html" aria-pressed="false" data-local><small>V2</small>Startseite im Kundenlook</button>
    <button type="button" data-page="startseite-v3.html" aria-pressed="false"><small>V3</small>Startseite Mittelweg</button>
    <button type="button" data-page="so-funktionierts.html" aria-pressed="false"><small>Neu</small>So funktioniert's</button>
    <button type="button" data-page="kochideen.html" aria-pressed="false"><small>Neu</small>Kochideen</button>
    <button type="button" data-page="fuer-dich.html" aria-pressed="false"><small>Neu</small>Für dich</button>
    <button type="button" data-page="ueber-uns.html" aria-pressed="false"><small>Neu</small>Über uns</button>
    <button type="button" data-page="kochidee-mekong.html" aria-pressed="false"><small>Neu</small>Kochidee Mekong</button>
    <button type="button" data-page="../waskocheichheute-shop/index.html" aria-pressed="false"><small>Shop</small>Start</button>
    <button type="button" data-page="../waskocheichheute-shop/kategorie.html" aria-pressed="false"><small>Shop</small>Gewürze</button>
    <button type="button" data-page="../waskocheichheute-shop/produkt.html?p=helvetica-110g" aria-pressed="false"><small>Shop</small>Produkt</button>
    <button type="button" data-page="../waskocheichheute-shop/warenkorb.html" aria-pressed="false"><small>Shop</small>Warenkorb</button>
    <button type="button" data-page="../foodkreator/index.html" aria-pressed="false"><small>FK</small>Start</button>
    <button type="button" data-page="../foodkreator/referenzen.html" aria-pressed="false"><small>FK</small>Referenzen</button>
    <button type="button" data-page="../foodkreator/ueber-uns.html" aria-pressed="false"><small>FK</small>Über uns</button>
    <button type="button" data-page="../foodkreator/kontakt.html" aria-pressed="false"><small>FK</small>Kontakt</button>
    <button type="button" data-page="teller.html" aria-pressed="false"><small>01</small>Der Teller</button>
    <button type="button" data-page="reise.html" aria-pressed="false"><small>02</small>Die Reise</button>
    <button type="button" data-page="glas.html" aria-pressed="false"><small>03</small>Das Gewürzglas</button>
  </div>
  <div class="seg" role="group" aria-label="Ansicht">
    <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-view="phone" aria-pressed="false">Handy</button>
  </div>
  <div class="seg" role="group" aria-label="Bewegung">
    <button type="button" data-motion="1" aria-pressed="true">Bewegung an</button>
    <button type="button" data-motion="0" aria-pressed="false">aus</button>
  </div>
  <span class="note">Entwurf · alle Bilder sind Vektorillustrationen im Code · <a class="open" id="open" href="startseite.html" target="_blank" rel="noopener">Seite einzeln öffnen ↗</a></span>
</div>
<div class="stage"><iframe id="frame" src="startseite.html" title="Entwurf"></iframe></div>
<script>
(function () {
  var state = { page: 'startseite.html', motion: '1' };
  var frame = document.getElementById('frame'), open = document.getElementById('open');
  function url() { return state.page + (state.motion === '0' ? (state.page.indexOf('?') >= 0 ? '&' : '?') + 'motion=0' : ''); }
  var bar = document.querySelector('.bar'), body = document.body;
  function setOff(v) { body.style.setProperty('--off', Math.max(0, Math.min(v, bar.offsetHeight)) + 'px'); }
  function measure() { body.style.setProperty('--barh', bar.offsetHeight + 'px'); }
  /* Die Seite im Fenster meldet ihre Scrollhöhe (siehe start.js / welten.js) */
  window.addEventListener('message', function (e) { if (e.data && typeof e.data.wsScroll === 'number') setOff(e.data.wsScroll); });
  window.addEventListener('resize', measure);
  if (document.fonts) document.fonts.ready.then(measure);
  measure();
  function load() { setOff(0); frame.src = url(); open.href = url(); }
  function group(attr, fn) {
    var btns = document.querySelectorAll('[' + attr + ']');
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        btns.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        fn(b.getAttribute(attr));
      });
    });
  }
  /* V2 liegt nur lokal (nicht im Repo): online den Knopf ausblenden */
  if (/github\.io$/.test(location.hostname)) document.querySelectorAll('[data-local]').forEach(function (b) { b.remove(); });
  group('data-page', function (v) { state.page = v; load(); });
  group('data-motion', function (v) { state.motion = v; load(); });
  group('data-view', function (v) { document.body.classList.toggle('is-phone', v === 'phone'); measure(); });
})();
</script>
</body>
</html>
